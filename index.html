<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ГенКарт</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #ffffff; --muted: #888888; --accent: #ff2a75; --accent-txt: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 80px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 20px; font-weight: 800; } .logo span { color: var(--accent); }
        
        .step-card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #2a2a2a; }
        .step-header { display: flex; align-items: center; margin-bottom: 16px; font-size: 16px; font-weight: 600; }
        .step-number { background: #333; color: var(--muted); width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; margin-right: 10px; }
        
        .upload-zone { border: 1.5px dashed #444; border-radius: 12px; padding: 30px 20px; text-align: center; cursor: pointer; position: relative; overflow: hidden; }
        .preview-img { display: none; width: 100%; height: 200px; object-fit: contain; border-radius: 8px; transition: filter 0.4s ease; }
        
        .loading-shimmer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); background-size: 200% 100%; animation: shimmer 1.5s infinite; display: none; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .preview-img.is-loading { filter: blur(5px) grayscale(50%); }
        .preview-img.is-loading + .loading-shimmer { display: block; }
        
        .input-text { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #333; background: #121212; color: white; margin-bottom: 10px; font-size: 14px; }
        .input-text::placeholder { color: #555; }
        textarea.input-text { min-height: 80px; resize: vertical; }
        
        .select-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .select-box { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #121212; color: white; font-size: 14px; }

        .bg-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; max-height: 150px; overflow-y: auto; }
        .bg-btn, .tpl-btn, .size-btn { padding: 10px; background: #121212; color: var(--muted); border: 1px solid #333; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; text-align: center; }
        .bg-btn.active, .tpl-btn.active, .size-btn.active { background: #2a2a2a; color: var(--accent); border-color: var(--accent); }

        .templates { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .tpl-btn { flex: 1; min-width: 45%; }
        
        .sizes { display: flex; gap: 10px; margin-bottom: 15px; }
        .size-btn { flex: 1; }

        .btn-generate { background: var(--accent); color: var(--accent-txt); border: none; width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 10px; }
        .btn-video { background: #333; color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
        
        .result-img { display: none; width: 100%; border-radius: 12px; margin-top: 10px; }
        .btn-download { display: none; background: #333; color: white; border: none; width: 100%; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 600; margin-top: 10px; cursor: pointer; text-align: center; text-decoration: none; }
        
        .status-text { font-size: 13px; color: var(--accent); text-align: center; margin-top: 10px; display: none; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="header"><div class="logo">Gen<span>Kart</span></div></div>

    <div class="step-card">
        <div class="step-header"><div class="step-number">1</div>Ваш товар</div>
        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon" id="uploadIcon" style="font-size: 32px; margin-bottom: 10px;">📦</div>
            <div id="uploadText" style="color: var(--muted); font-size: 14px;">Добавьте фото товара</div>
            <img id="previewImg" class="preview-img">
            <div class="loading-shimmer"></div>
        </div>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="step-card">
        <div class="step-header"><div class="step-number">2</div>Настройте генерацию</div>
        
        <input type="text" id="titleInput" class="input-text" placeholder="Заголовок (например: CELIMAX)">
        <input type="text" id="subtitleInput" class="input-text" placeholder="Подзаголовок (например: Молочный тонер)">
        <textarea id="featuresInput" class="input-text" placeholder="Преимущества (каждое с новой строки):
1. Увлажняет
2. Защищает
3. Восстанавливает"></textarea>
        
        <div style="font-size: 12px; color: var(--muted); margin-bottom: 8px;">Расположение текста:</div>
        <div class="templates">
            <button class="tpl-btn active" onclick="setTemplate('template1', this)">Сверху</button>
            <button class="tpl-btn" onclick="setTemplate('template2', this)">Слева</button>
            <button class="tpl-btn" onclick="setTemplate('template3', this)">Справа</button>
            <button class="tpl-btn" onclick="setTemplate('template4', this)">Инфографика</button>
        </div>
        
        <div style="font-size: 12px; color: var(--muted); margin-bottom: 8px;">Размер товара:</div>
        <div class="sizes">
            <button class="size-btn" onclick="setSize('small', this)">Маленький</button>
            <button class="size-btn active" onclick="setSize('medium', this)">Средний</button>
            <button class="size-btn" onclick="setSize('large', this)">Большой</button>
        </div>

        <div style="font-size: 12px; color: var(--muted); margin-bottom: 8px;">Фон (подиум):</div>
        <div class="bg-options">
            <button class="bg-btn active" onclick="setBg('bg1', this)">Ткань</button>
            <button class="bg-btn" onclick="setBg('bg2', this)">Дерево</button>
            <button class="bg-btn" onclick="setBg('bg3', this)">Темный</button>
            <button class="bg-btn" onclick="setBg('bg4', this)">Облака</button>
            <button class="bg-btn" onclick="setBg('bg5', this)">Шелк</button>
            <button class="bg-btn" onclick="setBg('bg6', this)">Лед</button>
            <button class="bg-btn" onclick="setBg('bg7', this)">Мрамор</button>
            <button class="bg-btn" onclick="setBg('bg8', this)">Стекло</button>
        </div>

        <button class="btn-generate" id="btnGenerate" disabled>
            Сгенерировать карточку <span>✨ 1</span>
        </button>
        <button class="btn-video" id="btnVideo" disabled>
            🎬 Сделать видео (GIF)
        </button>
        <div class="status-text" id="statusText"></div>
    </div>

    <div class="step-card" id="resultsCard" style="display: none;">
        <div class="step-header"><div class="step-number">3</div>Результаты</div>
        <img id="resultImg" class="result-img">
        <a id="btnDownload" class="btn-download" href="#">📥 Скачать</a>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand(); tg.setHeaderColor('#121212');
        
        const uploadZone = document.getElementById('uploadZone'), fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg'), btnGenerate = document.getElementById('btnGenerate');
        const btnVideo = document.getElementById('btnVideo');
        const resultsCard = document.getElementById('resultsCard'), resultImg = document.getElementById('resultImg');
        const statusText = document.getElementById('statusText'), btnDownload = document.getElementById('btnDownload');
        let currentFile = null;
        let currentBg = 'bg1';
        let currentTemplate = 'template1';
        let currentSize = 'medium';

        function setBg(bg, btn) {
            currentBg = bg;
            document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function setTemplate(tpl, btn) {
            currentTemplate = tpl;
            document.querySelectorAll('.tpl-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        
        function setSize(size, btn) {
            currentSize = size;
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        uploadZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            currentFile = e.target.files[0];
            if (currentFile) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    previewImg.src = ev.target.result; previewImg.style.display = 'block';
                    document.getElementById('uploadIcon').style.display = 'none';
                    document.getElementById('uploadText').style.display = 'none';
                    btnGenerate.disabled = false;
                    btnVideo.disabled = false;
                };
                reader.readAsDataURL(currentFile);
            }
        });

        async function sendRequest(isVideo = false) {
            if (!currentFile) return;
            
            previewImg.classList.add('is-loading');
            btnGenerate.disabled = true; 
            btnVideo.disabled = true;
            statusText.style.display = 'block';
            statusText.textContent = isVideo ? "Создаем анимацию..." : "Генерация...";

            const formData = new FormData();
            formData.append('file', currentFile);
            formData.append('title', document.getElementById('titleInput').value || "Название");
            formData.append('subtitle', document.getElementById('subtitleInput').value || "Описание");
            formData.append('features', document.getElementById('featuresInput').value || "");
            formData.append('background', currentBg);
            formData.append('template', currentTemplate);
            formData.append('size', currentSize);
            formData.append('is_video', isVideo ? 'true' : 'false');
            
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                formData.append('chat_id', tg.initDataUnsafe.user.id);
            }

            try {
                const response = await fetch('https://genkart-app.onrender.com/generate-card', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    
                    resultImg.src = url; 
                    resultImg.style.display = 'block';
                    btnDownload.href = url;
                    btnDownload.style.display = 'block';
                    resultsCard.style.display = 'block';
                    
                    setTimeout(() => {
                        resultsCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 100);

                    statusText.textContent = "Готово! Отправлено в чат.";
                } else {
                    tg.showAlert("Ошибка на сервере.");
                }
            } catch (error) {
                tg.showAlert("Ошибка сети.");
            } finally {
                previewImg.classList.remove('is-loading');
                btnGenerate.disabled = false; 
                btnVideo.disabled = false;
                btnGenerate.innerHTML = "Сгенерировать заново";
                btnGenerate.style.background = "#333"; 
                btnGenerate.style.color = "#fff";
            }
        }

        btnGenerate.addEventListener('click', () => sendRequest(false));
        btnVideo.addEventListener('click', () => sendRequest(true));

        btnDownload.addEventListener('click', (e) => {
            e.preventDefault();
            tg.showAlert("Файл уже в чате! Проверьте сообщения.");
        });
    </script>
</body>
</html>
