<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГенКарт</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; padding: 20px; text-align: center; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        input[type="file"] { display: none; }
        .btn { background: #bbff00; color: black; padding: 15px; border: none; border-radius: 10px; font-weight: bold; width: 100%; margin-top: 10px; font-size: 16px; cursor: pointer; }
        .btn:disabled { opacity: 0.5; }
        .input-text { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #121212; color: white; margin-bottom: 10px; box-sizing: border-box; }
        .preview { display: none; width: 100%; border-radius: 10px; margin-top: 10px; }
        .status { color: #bbff00; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <h2>ГенКарт</h2>
    
    <div class="card">
        <p>1. Загрузите фото товара</p>
        <input type="file" id="fileInput" accept="image/*">
        <button class="btn" onclick="document.getElementById('fileInput').click()">Выбрать фото</button>
        <img id="preview" class="preview">
    </div>

    <div class="card">
        <p>2. Введите текст</p>
        <input type="text" id="titleInput" class="input-text" placeholder="Заголовок (например: CELIMAX)">
        <input type="text" id="subtitleInput" class="input-text" placeholder="Подзаголовок">
    </div>

    <div class="card">
        <p>3. Генерация</p>
        <button id="btnGenerate" class="btn" disabled>Сгенерировать</button>
        <p id="status" class="status">Загрузка...</p>
        <a id="downloadLink" style="display:none; color:#bbff00; font-weight:bold; margin-top:15px; text-decoration:none;" download="genkart-card.png">📥 Скачать карточку</a>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const btnGenerate = document.getElementById('btnGenerate');
        const status = document.getElementById('status');
        const downloadLink = document.getElementById('downloadLink');
        let currentFile = null;

        fileInput.addEventListener('change', (e) => {
            currentFile = e.target.files[0];
            if (currentFile) {
                preview.src = URL.createObjectURL(currentFile);
                preview.style.display = 'block';
                btnGenerate.disabled = false;
            }
        });

        btnGenerate.addEventListener('click', async () => {
            if (!currentFile) return;
            
            btnGenerate.disabled = true;
            btnGenerate.textContent = "Ждите (до 60 сек)...";
            status.style.display = 'block';
            status.textContent = "Сервер просыпается и обрабатывает фото...";

            const formData = new FormData();
            formData.append('file', currentFile);
            formData.append('title', document.getElementById('titleInput').value || "Название");
            formData.append('subtitle', document.getElementById('subtitleInput').value || "Описание");

            try {
                const response = await fetch('https://genkart-app.onrender.com/generate-card', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    
                    // Показываем картинку и ссылку для скачивания
                    preview.src = url;
                    downloadLink.href = url;
                    downloadLink.style.display = 'block';
                    
                    status.textContent = "Готово!";
                    btnGenerate.textContent = "Сгенерировать заново";
                } else {
                    status.textContent = "Ошибка сервера. Попробуйте позже.";
                }
            } catch (error) {
                status.textContent = "Ошибка сети. Сервер не отвечает.";
            } finally {
                btnGenerate.disabled = false;
            }
        });
    </script>
</body>
</html>
