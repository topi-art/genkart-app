<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GenDoc</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #ffffff; --muted: #888888; --accent: #ff2a75; --border: #3f3f3f; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 16px; padding-bottom: 100px; margin: 0; }
        .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #2a2a2a; }
        .input-text, select { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border); background: #121212; color: white; margin-bottom: 10px; box-sizing: border-box; font-size: 14px;}
        .btn-generate { background: var(--accent); color: white; border: none; width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-secondary { background: #333; color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; cursor: pointer; margin-bottom: 15px; font-weight: 600;}
        .templates { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .tpl-btn { flex: 1; min-width: 30%; padding: 10px; background: #121212; color: var(--muted); border: 1px solid #333; border-radius: 8px; cursor: pointer; text-align: center; font-weight: 600;}
        .tpl-btn.active { background: #2a2a2a; color: var(--accent); border-color: var(--accent); }
        .format-switch { display: flex; gap: 15px; margin-bottom: 15px; background: #121212; padding: 10px; border-radius: 10px; border: 1px solid var(--border); }
        .format-switch label { color: white; display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 14px;}
        
        .service-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .service-row input { margin-bottom: 0; padding: 10px; font-size: 12px; }
        .input-name { flex: 3; }
        .input-unit { flex: 1; min-width: 50px; }
        .input-qty { flex: 1; min-width: 45px; }
        .input-price { flex: 2; }
        .btn-remove { background: #ff2a75; color: white; border: none; border-radius: 8px; padding: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <input type="text" id="companyInput" class="input-text" placeholder="Название компании" value='ООО "Тест"'>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="innInput" class="input-text" placeholder="ИНН" value="1234567890">
            <button class="btn-secondary" style="width: auto; margin-bottom: 10px;" onclick="fetchCompanyData()">Найти по ИНН</button>
        </div>
        <input type="text" id="kppInput" class="input-text" placeholder="КПП" value="">
        <input type="text" id="addressInput" class="input-text" placeholder="Адрес" value="123456, г. Москва, ул. Ленина, д. 1">
        <input type="text" id="contactInput" class="input-text" placeholder="Телефон" value="+7 999 999-99-99">
        <select id="taxMode" class="input-text">
            <option value="usn">УСН (Без НДС)</option>
            <option value="osno">ОСНО (С НДС 22%)</option>
        </select>
        <input type="text" id="directorInput" class="input-text" placeholder="ФИО Директора" value="Иванов И.И.">
    </div>

    <div class="card">
        <div class="templates">
            <button class="tpl-btn active" onclick="setTemplate('kp', this)">КП</button>
            <button class="tpl-btn" onclick="setTemplate('smeta', this)">Смета</button>
            <button class="tpl-btn" onclick="setTemplate('dogovor', this)">Договор</button>
            <button class="tpl-btn" onclick="setTemplate('act', this)">Акт</button>
            <button class="tpl-btn" onclick="setTemplate('invoice', this)">Счет</button>
        </div>

        <div class="format-switch">
            <label><input type="radio" name="format" value="pdf" checked> Скачать PDF</label>
            <label><input type="radio" name="format" value="docx"> Скачать Word (DOCX)</label>
        </div>

        <div id="servicesContainer">
            <div class="service-row">
                <input type="text" class="input-text input-name" placeholder="Услуга" value='Транспортировка'>
                <input type="text" class="input-text input-unit" placeholder="Ед." value="рейс">
                <input type="text" class="input-text input-qty" placeholder="Кол-во" value="1">
                <input type="text" class="input-text input-price" placeholder="Цена" value="10000">
                <button class="btn-remove" onclick="removeService(this)">×</button>
            </div>
        </div>
        
        <button class="btn-secondary" onclick="addService()">+ Добавить услугу</button>
        
        <input type="text" id="dogovorNumber" class="input-text" placeholder="Номер договора" value="б/н">
        <input type="text" id="customerName" class="input-text" placeholder="Наименование Заказчика" value='ООО "Заказчик"'>
        <input type="text" id="customerInn" class="input-text" placeholder="ИНН Заказчика" value="0987654321">
        <input type="text" id="customerDirector" class="input-text" placeholder="ФИО Директора Заказчика" value="Петров Петр Петрович">

        <button class="btn-generate" id="btnGenerateDoc" style="margin-top: 15px;">Создать документ 📄</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const chatId = tg.initDataUnsafe?.user?.id;
        let currentTemplate = 'kp';

        function addService() {
            const container = document.getElementById('servicesContainer');
            const row = document.createElement('div');
            row.className = 'service-row';
            row.innerHTML = `
                <input type="text" class="input-text input-name" placeholder="Наименование" value="">
                <input type="text" class="input-text input-unit" placeholder="Ед." value="шт">
                <input type="text" class="input-text input-qty" placeholder="Кол-во" value="1">
                <input type="text" class="input-text input-price" placeholder="Цена" value="">
                <button class="btn-remove" onclick="removeService(this)">×</button>
            `;
            container.appendChild(row);
        }

        function removeService(btn) {
            if (document.querySelectorAll('.service-row').length > 1) {
                btn.parentElement.remove();
            } else {
                tg.showAlert("Должна остаться хотя бы одна услуга!");
            }
        }

        function setTemplate(tpl, btn) {
            currentTemplate = tpl;
            document.querySelectorAll('.tpl-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        document.getElementById('btnGenerateDoc').addEventListener('click', async () => {
            const btn = document.getElementById('btnGenerateDoc'); btn.disabled = true; btn.textContent = "Отправка...";
            
            const services = [];
            document.querySelectorAll('.service-row').forEach(row => {
                const name = row.querySelector('.input-name').value;
                const unit = row.querySelector('.input-unit').value;
                const qty = row.querySelector('.input-qty').value;
                const price = row.querySelector('.input-price').value;
                if (name && price) services.push({ name, unit, qty, price });
            });

            if (services.length === 0) {
                tg.showAlert("Добавьте хотя бы одну услугу!"); 
                btn.disabled = false; btn.textContent = "Создать документ 📄"; 
                return;
            }

            const fd = new FormData();
            fd.append('chat_id', chatId); fd.append('template', currentTemplate);
            fd.append('format_type', document.querySelector('input[name="format"]:checked').value);
            fd.append('company', document.getElementById('companyInput').value);
            fd.append('inn', document.getElementById('innInput').value);
            fd.append('kpp', document.getElementById('kppInput').value);
            fd.append('address', document.getElementById('addressInput').value);
            fd.append('contacts', document.getElementById('contactInput').value);
            fd.append('tax_mode', document.getElementById('taxMode').value);
            fd.append('director', document.getElementById('directorInput').value);
            fd.append('dogovor_number', document.getElementById('dogovorNumber').value);
            fd.append('customer_name', document.getElementById('customerName').value);
            fd.append('customer_inn', document.getElementById('customerInn').value);
            fd.append('customer_director', document.getElementById('customerDirector').value);
            fd.append('services_json', JSON.stringify(services));

            try {
                const res = await fetch('/generate-doc', { method: 'POST', body: fd });
                if (res.ok) { tg.showAlert("Документ отправлен в чат!"); } else { tg.showAlert("Ошибка сервера"); }
            } catch (e) { tg.showAlert("Ошибка сети"); } finally { btn.disabled = false; btn.textContent = "Создать документ 📄"; }
        });
    </script>
</body>
</html>
