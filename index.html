<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GenDoc</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #ffffff; --muted: #888888; --accent: #ff2a75; --accent-txt: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 80px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 20px; font-weight: 800; } .logo span { color: var(--accent); }
        
        .step-card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #2a2a2a; }
        .step-header { display: flex; align-items: center; margin-bottom: 16px; font-size: 16px; font-weight: 600; }
        .step-number { background: #333; color: var(--muted); width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; margin-right: 10px; }
        
        .input-text { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #333; background: #121212; color: white; margin-bottom: 10px; font-size: 14px; }
        .input-text::placeholder { color: #555; }
        
        .upload-zone { border: 1.5px dashed #444; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 10px; }
        .preview-img { display: none; max-width: 100%; height: 80px; object-fit: contain; border-radius: 8px; margin: 0 auto; }

        .templates { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .tpl-btn { flex: 1; min-width: 45%; padding: 12px; background: #121212; color: var(--muted); border: 1px solid #333; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; text-align: center; }
        .tpl-btn.active { background: #2a2a2a; color: var(--accent); border-color: var(--accent); }

        .btn-generate { background: var(--accent); color: var(--accent-txt); border: none; width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
        
        .status-text { font-size: 13px; color: var(--accent); text-align: center; margin-top: 10px; display: none; }
        input[type="file"] { display: none; }
        
        #profileSection { display: block; }
        #generateSection { display: none; }
        
        .dynamic-fields { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #333; }
        .dynamic-fields.active { display: block; }
    </style>
</head>
<body>
    <div class="header"><div class="logo">Gen<span>Doc</span></div></div>

    <!-- СЕКЦИЯ ПРОФИЛЯ (ОБЩИЕ ДАННЫЕ) -->
    <div id="profileSection" class="step-card">
        <div class="step-header"><div class="step-number">1</div>Профиль компании</div>
        <input type="text" id="companyInput" class="input-text" placeholder="Название компании (ООО, ИП)">
        <input type="text" id="innInput" class="input-text" placeholder="ИНН / КПП">
        <input type="text" id="addressInput" class="input-text" placeholder="Юридический адрес">
        <input type="text" id="contactInput" class="input-text" placeholder="Контакты (телефон, сайт)">
        <div class="upload-zone" id="uploadZone">
            <div id="uploadIcon" style="font-size: 24px; margin-bottom: 5px;">🖼️</div>
            <div id="uploadText" style="color: var(--muted); font-size: 13px;">Загрузите логотип (PNG)</div>
            <img id="previewImg" class="preview-img">
        </div>
        <input type="file" id="fileInput" accept="image/png">
        <button class="btn-generate" id="btnSaveProfile" disabled>Сохранить профиль</button>
    </div>

    <!-- СЕКЦИЯ ГЕНЕРАЦИИ -->
    <div id="generateSection" class="step-card">
        <div class="step-header"><div class="step-number">2</div>Создайте документ</div>
        
        <div style="font-size: 12px; color: var(--muted); margin-bottom: 8px;">Тип документа:</div>
        <div class="templates">
            <button class="tpl-btn active" onclick="setTemplate('kp', this)">КП</button>
            <button class="tpl-btn" onclick="setTemplate('smeta', this)">Смета</button>
            <button class="tpl-btn" onclick="setTemplate('dogovor', this)">Договор</button>
        </div>

        <!-- ОБЩИЕ ПОЛЯ (ДЛЯ ВСЕХ) -->
        <input type="text" id="serviceInput" class="input-text" placeholder="Услуга / Наименование работ">
        <input type="text" id="priceInput" class="input-text" placeholder="Цена (руб.)">
        
        <!-- ДИНАМИЧЕСКИЕ ПОЛЯ ДЛЯ ДОГОВОРА -->
        <div id="dogovorFields" class="dynamic-fields">
            <input type="text" id="dogovorNumber" class="input-text" placeholder="Номер договора (например: 15/26)">
            <input type="text" id="dogovorDate" class="input-text" placeholder="Дата договора (например: 12.11.2026)">
            <input type="text" id="customerName" class="input-text" placeholder="Наименование Заказчика">
            <input type="text" id="customerInn" class="input-text" placeholder="ИНН Заказчика">
            <input type="text" id="customerAddress" class="input-text" placeholder="Адрес Заказчика">
            <input type="text" id="directorName" class="input-text" placeholder="ФИО Директора (в родительном падеже)">
        </div>

        <!-- ДИНАМИЧЕСКИЕ ПОЛЯ ДЛЯ СМЕТЫ -->
        <div id="smetaFields" class="dynamic-fields">
            <input type="text" id="smetaTerm" class="input-text" placeholder="Сроки выполнения (дней)">
            <input type="text" id="smetaDate" class="input-text" placeholder="Дата сметы">
        </div>
        
        <button class="btn-generate" id="btnGenerateDoc" disabled>Создать документ 📄</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand(); tg.setHeaderColor('#121212');
        const chatId = tg.initDataUnsafe?.user?.id;
        
        if (!chatId) tg.showAlert("Ошибка: нет ID пользователя");

        let currentFile = null;
        let currentTemplate = 'kp';

        // Логика переключения полей
        function setTemplate(tpl, btn) {
            currentTemplate = tpl;
            document.querySelectorAll('.tpl-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Скрываем все динамические блоки
            document.getElementById('dogovorFields').classList.remove('active');
            document.getElementById('smetaFields').classList.remove('active');

            // Показываем нужный
            if (tpl === 'dogovor') {
                document.getElementById('dogovorFields').classList.add('active');
            } else if (tpl === 'smeta') {
                document.getElementById('smetaFields').classList.add('active');
            }
        }

        // ... (Логика загрузки логотипа и сохранения профиля остается прежней) ...

        // Логика генерации
        document.getElementById('btnGenerateDoc').addEventListener('click', async () => {
            const btn = document.getElementById('btnGenerateDoc');
            btn.disabled = true; btn.textContent = "Создаем PDF... ⏳";
            
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('template', currentTemplate);
            formData.append('service', document.getElementById('serviceInput').value);
            formData.append('price', document.getElementById('priceInput').value);

            // Добавляем специфичные поля
            if (currentTemplate === 'dogovor') {
                formData.append('dogovor_number', document.getElementById('dogovorNumber').value);
                formData.append('dogovor_date', document.getElementById('dogovorDate').value);
                formData.append('customer_name', document.getElementById('customerName').value);
                formData.append('customer_inn', document.getElementById('customerInn').value);
                formData.append('customer_address', document.getElementById('customerAddress').value);
                formData.append('director_name', document.getElementById('directorName').value);
            } else if (currentTemplate === 'smeta') {
                formData.append('smeta_term', document.getElementById('smetaTerm').value);
                formData.append('smeta_date', document.getElementById('smetaDate').value);
            }

            try {
                const response = await fetch('https://genkart-app.onrender.com/generate-doc', { method: 'POST', body: formData });
                if (response.ok) {
                    tg.showAlert("Документ отправлен в чат!");
                } else {
                    tg.showAlert("Ошибка на сервере.");
                }
            } catch (e) {
                tg.showAlert("Ошибка сети.");
            } finally {
                btn.disabled = false; btn.textContent = "Создать документ 📄";
            }
        });
    </script>
</body>
</html>
