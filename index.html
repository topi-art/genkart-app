<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ГенКарт</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #bbff00;
            --accent-text: #000000;
            --border-radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 80px;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 0 4px;
        }
        .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .logo span { color: var(--accent); }
        .btn-login {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Карточки шагов */
        .step-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #2a2a2a;
        }
        .step-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            font-size: 16px;
            font-weight: 600;
        }
        .step-number {
            background: #333;
            color: var(--text-muted);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            margin-right: 10px;
        }

        /* Зона загрузки */
        .upload-zone {
            border: 1.5px dashed #444;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }
        .upload-zone:active { background: #2a2a2a; }
        .upload-icon { font-size: 32px; margin-bottom: 10px; opacity: 0.8; }
        .upload-text { font-size: 14px; color: var(--text-muted); margin-bottom: 15px; }
        .btn-choose {
            background: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-block;
        }
        .preview-img {
            display: none;
            width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 8px;
        }

        /* Табы */
        .tabs {
            display: flex;
            background: #121212;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 16px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab.active {
            background: #2a2a2a;
            color: var(--text-main);
            font-weight: 600;
        }

        .settings-placeholder {
            border: 1px dashed #333;
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 16px;
        }

        /* Кнопка генерации */
        .btn-generate {
            background: var(--accent);
            color: var(--accent-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .badge {
            background: rgba(0,0,0,0.2);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
        }

        /* Блок результатов */
        .results-zone {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
        .result-img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .status-text {
            font-size: 13px;
            color: var(--accent);
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        /* Нижнее меню */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #2a2a2a;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
        }
        .nav-item.active { color: var(--text-main); }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Gen<span>Kart</span></div>
        <button class="btn-login">Войти</button>
    </div>

    <!-- Шаг 1 -->
    <div class="step-card">
        <div class="step-header">
            <div class="step-number">1</div>
            Ваш товар
        </div>
        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon" id="uploadIcon">📦</div>
            <div class="upload-text" id="uploadText">Добавьте фото товара</div>
            <button class="btn-choose" id="btnChoose">+ Выбрать фото</button>
            <img id="previewImg" class="preview-img" src="" alt="Превью">
        </div>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <!-- Шаг 2 -->
    <div class="step-card">
        <div class="step-header">
            <div class="step-number">2</div>
            Настройте генерацию
        </div>
        
        <div class="tabs">
            <div class="tab active">Фото</div>
            <div class="tab">Карточка</div>
            <div class="tab">Видео</div>
        </div>

        <div class="settings-placeholder" id="settingsPlaceholder">
            Загрузите фото товара — и здесь появятся настройки стиля
        </div>

        <button class="btn-generate" id="btnGenerate" disabled>
            Сгенерировать <span class="badge" id="trialBadge">✨ 1</span>
        </button>
        <div class="status-text" id="statusText"></div>
    </div>

    <!-- Шаг 3 -->
    <div class="step-card" id="resultsCard" style="display: none;">
        <div class="step-header">
            <div class="step-number">3</div>
            Результаты
        </div>
        <div class="results-zone" id="resultsZone">
            <img id="resultImg" class="result-img" src="" alt="Результат">
            <button class="btn-choose" id="btnDownload" style="width: 100%;">Скачать карточку</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">
            <div class="nav-icon">➕</div>
            <div>Создать</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">📁</div>
            <div>Проекты</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">👤</div>
            <div>Профиль</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#121212');

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const uploadIcon = document.getElementById('uploadIcon');
        const uploadText = document.getElementById('uploadText');
        const btnChoose = document.getElementById('btnChoose');
        const btnGenerate = document.getElementById('btnGenerate');
        const statusText = document.getElementById('statusText');
        const resultsCard = document.getElementById('resultsCard');
        const resultsZone = document.getElementById('resultsZone');
        const resultImg = document.getElementById('resultImg');
        const btnDownload = document.getElementById('btnDownload');
        const trialBadge = document.getElementById('trialBadge');
        const settingsPlaceholder = document.getElementById('settingsPlaceholder');

        // Загрузка фото
        uploadZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    previewImg.src = event.target.result;
                    previewImg.style.display = 'block';
                    uploadIcon.style.display = 'none';
                    uploadText.style.display = 'none';
                    btnChoose.style.display = 'none';
                    
                    btnGenerate.disabled = false;
                    settingsPlaceholder.innerHTML = "✅ Фото загружено! Нажмите 'Сгенерировать'.";
                    settingsPlaceholder.style.borderColor = "var(--accent)";
                };
                reader.readAsDataURL(file);
            }
        });

        // Генерация
        btnGenerate.addEventListener('click', () => {
            btnGenerate.disabled = true;
            btnGenerate.innerHTML = "Генерация... ⏳";
            statusText.style.display = 'block';
            statusText.textContent = "Обработка фото...";

            setTimeout(() => {
                // Показываем результат
                resultImg.src = previewImg.src;
                resultsCard.style.display = 'block';
                resultsZone.style.display = 'block'; 
                
                // Плавно прокручиваем экран к результату
                setTimeout(() => {
                    resultsCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 100);

                // Меняем кнопку
                trialBadge.textContent = "✨ 0";
                trialBadge.style.background = "#ff4444";
                trialBadge.style.color = "#fff";
                
                btnGenerate.innerHTML = "Купить подписку";
                btnGenerate.style.background = "#333";
                btnGenerate.style.color = "#fff";
                statusText.textContent = "Пробная попытка использована.";
                
                btnGenerate.disabled = false;
                btnGenerate.onclick = () => {
                    tg.showAlert("Здесь будет подключена оплата ЮKassa!");
                };

            }, 2000);
        });

        // Скачивание
        btnDownload.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'genkart-result.png';
            link.href = resultImg.src;
            link.click();
        });
    </script>
</body>
</html>
