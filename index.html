<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GenDoc</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #ffffff; --muted: #888888; --accent: #ff2a75; --accent-txt: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 80px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 20px; font-weight: 800; } .logo span { color: var(--accent); }
        
        .step-card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #2a2a2a; }
        .step-header { display: flex; align-items: center; margin-bottom: 16px; font-size: 16px; font-weight: 600; }
        .step-number { background: #333; color: var(--muted); width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; margin-right: 10px; }
        
        .input-text { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #333; background: #121212; color: white; margin-bottom: 10px; font-size: 14px; }
        .input-text::placeholder { color: #555; }
        
        .upload-zone { border: 1.5px dashed #444; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 10px; }
        .preview-img { display: none; max-width: 100%; height: 80px; object-fit: contain; border-radius: 8px; margin: 0 auto; }

        .templates { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .tpl-btn { flex: 1; min-width: 45%; padding: 12px; background: #121212; color: var(--muted); border: 1px solid #333; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; text-align: center; }
        .tpl-btn.active { background: #2a2a2a; color: var(--accent); border-color: var(--accent); }

        .btn-generate { background: var(--accent); color: var(--accent-txt); border: none; width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
        
        .status-text { font-size: 13px; color: var(--accent); text-align: center; margin-top: 10px; display: none; }
        input[type="file"] { display: none; }
        
        #profileSection { display: block; }
        #generateSection { display: none; }
    </style>
</head>
<body>
    <div class="header"><div class="logo">Gen<span>Doc</span></div></div>

    <div id="profileSection" class="step-card">
        <div class="step-header"><div class="step-number">1</div>Профиль</div>
        
        <input type="text" id="companyInput" class="input-text" placeholder="Название компании (ООО, ИП)">
        <input type="text" id="innInput" class="input-text" placeholder="ИНН / КПП">
        <input type="text" id="addressInput" class="input-text" placeholder="Юридический адрес">
        <input type="text" id="contactInput" class="input-text" placeholder="Контакты (телефон, сайт)">
        
        <div class="upload-zone" id="uploadZone">
            <div id="uploadIcon" style="font-size: 24px; margin-bottom: 5px;">🖼️</div>
            <div id="uploadText" style="color: var(--muted); font-size: 13px;">Загрузите логотип (PNG)</div>
            <img id="previewImg" class="preview-img">
        </div>
        <input type="file" id="fileInput" accept="image/png">
        
        <button class="btn-generate" id="btnSaveProfile" disabled>Сохранить профиль</button>
    </div>

    <div id="generateSection" class="step-card">
        <div class="step-header"><div class="step-number">2</div>Документ</div>
        
        <div style="font-size: 12px; color: var(--muted); margin-bottom: 8px;">Тип документа:</div>
        <div class="templates">
            <button class="tpl-btn active" onclick="setTemplate('kp', this)">КП</button>
            <button class="tpl-btn" onclick="setTemplate('smeta', this)">Смета</button>
            <button class="tpl-btn" onclick="setTemplate('dogovor', this)">Договор</button>
        </div>

        <input type="text" id="serviceInput" class="input-text" placeholder="Услуга">
        <input type="text" id="priceInput" class="input-text" placeholder="Цена">
        <input type="text" id="termInput" class="input-text" placeholder="Сроки (в днях)">
        
        <div style="font-size: 12px; color: var(--muted); margin-bottom: 8px; margin-top: 15px;">Условия оплаты:</div>
        <div class="templates">
            <button class="tpl-btn active" onclick="setPayment('prepay', this)">100% предоплата</button>
            <button class="tpl-btn" onclick="setPayment('half', this)">50/50</button>
            <button class="tpl-btn" onclick="setPayment('postpay', this)">Постоплата</button>
        </div>
        
        <button class="btn-generate" id="btnGenerateDoc" disabled>Создать документ 📄</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand(); tg.setHeaderColor('#121212');
        const chatId = tg.initDataUnsafe?.user?.id;
        
        if (!chatId) tg.showAlert("Ошибка: нет ID пользователя");

        const uploadZone = document.getElementById('uploadZone'), fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        let currentFile = null;
        let currentTemplate = 'kp';
        let currentPayment = 'prepay';

        function setTemplate(tpl, btn) {
            currentTemplate = tpl;
            document.querySelectorAll('.tpl-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function setPayment(pay, btn) {
            currentPayment = pay;
            // Ищем кнопки оплаты отдельно, чтобы не сбить выбор шаблона
            const paymentBtns = btn.parentElement.querySelectorAll('.tpl-btn');
            paymentBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        uploadZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            currentFile = e.target.files[0];
            if (currentFile) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    previewImg.src = ev.target.result; previewImg.style.display = 'block';
                    document.getElementById('uploadIcon').style.display = 'none';
                    document.getElementById('uploadText').style.display = 'none';
                };
                reader.readAsDataURL(currentFile);
            }
        });

        const profileInputs = [
            document.getElementById('companyInput'), 
            document.getElementById('innInput'),
            document.getElementById('addressInput'),
            document.getElementById('contactInput')
        ];
        
        profileInputs.forEach(input => {
            input.addEventListener('input', () => {
                const allFilled = profileInputs.every(i => i.value.trim() !== '');
                document.getElementById('btnSaveProfile').disabled = !allFilled;
            });
        });

        document.getElementById('btnSaveProfile').addEventListener('click', async () => {
            const btn = document.getElementById('btnSaveProfile');
            btn.disabled = true; btn.textContent = "Сохранение...";
            
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('company', document.getElementById('companyInput').value);
            formData.append('inn', document.getElementById('innInput').value);
            formData.append('address', document.getElementById('addressInput').value);
            formData.append('contacts', document.getElementById('contactInput').value);
            if (currentFile) formData.append('logo', currentFile);

            try {
                const response = await fetch('https://genkart-app.onrender.com/save-profile', { method: 'POST', body: formData });
                if (response.ok) {
                    document.getElementById('profileSection').style.display = 'none';
                    document.getElementById('generateSection').style.display = 'block';
                    checkGenerateBtn();
                }
            } catch (e) {
                tg.showAlert("Ошибка сети");
                btn.disabled = false; btn.textContent = "Сохранить профиль";
            }
        });

        const genInputs = [document.getElementById('serviceInput'), document.getElementById('priceInput'), document.getElementById('termInput')];
        function checkGenerateBtn() {
            const allFilled = genInputs.every(i => i.value.trim() !== '');
            document.getElementById('btnGenerateDoc').disabled = !allFilled;
        }
        genInputs.forEach(input => input.addEventListener('input', checkGenerateBtn));

        document.getElementById('btnGenerateDoc').addEventListener('click', async () => {
            const btn = document.getElementById('btnGenerateDoc');
            btn.disabled = true; btn.textContent = "Создаем PDF... ⏳";
            
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('service', document.getElementById('serviceInput').value);
            formData.append('price', document.getElementById('priceInput').value);
            formData.append('term', document.getElementById('termInput').value);
            formData.append('template', currentTemplate);
            formData.append('payment', currentPayment);

            try {
                const response = await fetch('https://genkart-app.onrender.com/generate-doc', { method: 'POST', body: formData });
                if (response.ok) {
                    tg.showAlert("Документ отправлен в чат!");
                } else {
                    tg.showAlert("Ошибка на сервере.");
                }
            } catch (e) {
                tg.showAlert("Ошибка сети.");
            } finally {
                btn.disabled = false; btn.textContent = "Создать документ 📄";
            }
        });
    </script>
</body>
</html>
