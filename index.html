<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenDoc</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; padding: 16px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 16px; border-radius: 12px; border: none; background: #ff2a75; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        #result { margin-top: 20px; color: #bbff00; font-size: 16px; text-align: center; }
    </style>
</head>
<body>
    <h2>Профиль</h2>
    <input type="text" id="company" placeholder="Название компании" value="ООО Тест">
    <input type="text" id="inn" placeholder="ИНН" value="1234567890">
    <input type="text" id="address" placeholder="Адрес" value="г. Москва">
    <input type="text" id="contacts" placeholder="Контакты" value="+7 999 999-99-99">
    
    <button id="saveBtn">Сохранить профиль</button>
    
    <div id="result"></div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const chatId = tg.initDataUnsafe?.user?.id;
        const result = document.getElementById('result');

        document.getElementById('saveBtn').addEventListener('click', async () => {
            result.textContent = "Отправка...";
            
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('company', document.getElementById('company').value);
            formData.append('inn', document.getElementById('inn').value);
            formData.append('address', document.getElementById('address').value);
            formData.append('contacts', document.getElementById('contacts').value);

            try {
                const response = await fetch('https://genkart-app.onrender.com/save-profile', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    result.textContent = "✅ Успех! " + data.message;
                } else {
                    result.textContent = "❌ Ошибка сервера: " + (data.message || 'Неизвестно');
                }
            } catch (e) {
                result.textContent = "❌ Ошибка сети: сервер не отвечает.";
            }
        });
    </script>
</body>
</html>
