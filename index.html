<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #121212; color: white; padding: 20px; font-family: sans-serif; text-align: center; }
        button { padding: 20px; font-size: 18px; width: 100%; background: #ff2a75; color: white; border: none; border-radius: 10px; margin-top: 20px; }
        #result { margin-top: 20px; color: #bbff00; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Проверка связи</h1>
    <button id="btn">Нажми меня</button>
    <div id="result"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        document.getElementById('btn').addEventListener('click', async () => {
            const res = document.getElementById('result');
            res.textContent = "Отправка запроса...";
            
            try {
                const response = await fetch('https://genkart-app.onrender.com/');
                const data = await response.json();
                res.textContent = "✅ Сервер ответил: " + data.message;
            } catch (e) {
                res.textContent = "❌ Ошибка сети. Сервер не отвечает.";
            }
        });
    </script>
</body>
</html>
